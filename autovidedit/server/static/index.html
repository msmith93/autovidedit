<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>autovidedit review</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header>
  <div class="brand">autovidedit <span id="video-name"></span></div>
  <div class="header-actions">
    <span id="dirty-indicator" class="dirty hidden">● unsaved changes</span>
    <button id="save-btn">Save</button>
    <button id="render-btn" class="primary">Render…</button>
  </div>
</header>

<main>
  <section class="player-pane">
    <video id="video" src="/video" preload="auto"></video>
    <canvas id="waveform" height="90"></canvas>
    <div class="controls">
      <button id="play-btn" title="Space">▶</button>
      <span id="time-label">00:00 / 00:00</span>
      <button id="skip-btn" class="active" title="S — skip removed regions during playback">Skip removed</button>
      <span class="spacer"></span>
      <span class="speed-label">Speed:</span>
      <span id="speed-buttons"></span>
    </div>
    <div class="hint">Space play/pause · ←/→ seek 5s · S skip removed · click a row to jump · shift/ctrl-click to multi-select · K keep · R remove</div>
  </section>

  <section class="list-pane">
    <div class="list-toolbar">
      <span id="selection-count"></span>
      <button id="keep-selected" title="K">Keep</button>
      <button id="remove-selected" title="R">Remove</button>
    </div>
    <div id="entry-list"></div>
    <div class="list-footer" id="removal-summary"></div>
  </section>
</main>

<div id="render-modal" class="modal hidden">
  <div class="modal-box">
    <h2>Render video</h2>
    <div id="render-form">
      <p id="render-summary"></p>
      <label>Output file
        <input type="text" id="render-output">
      </label>
      <label class="checkbox">
        <input type="checkbox" id="render-reencode">
        Re-encode video for frame-precise cuts (slower)
      </label>
      <div class="modal-actions">
        <button id="render-cancel">Cancel</button>
        <button id="render-start" class="primary">Start render</button>
      </div>
    </div>
    <div id="render-progress" class="hidden">
      <div class="progress-track"><div id="progress-fill"></div></div>
      <p id="progress-msg"></p>
      <div class="modal-actions">
        <button id="render-cancel-run">Cancel render</button>
        <button id="render-close" class="hidden">Close</button>
      </div>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
