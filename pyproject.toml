[project]
name = "autovidedit"
version = "2.0.0"
description = "Cuts dead air, retakes and filler from recordings, with AI suggestions and a human review step"
requires-python = ">=3.10"
dependencies = [
    "pydub>=0.25.1",
    "faster-whisper>=1.0.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "numpy"]
# Claude-powered `autovidedit suggest`
ai = ["anthropic>=1.6"]
# CUDA runtime libs for GPU transcription (loaded by core/cuda_libs.py)
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]

[project.scripts]
autovidedit = "autovidedit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["autovidedit*"]

[tool.setuptools.package-data]
"autovidedit.server" = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
